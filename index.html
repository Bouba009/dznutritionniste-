<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DZ Nutritionniste</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- ملف الستايل -->
    <link rel="stylesheet" href="style.css">

    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <!-- تنبيهات احترافية -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="spinner"></div>
        <h4 class="loader-text">DZ Nutritionniste</h4>
    </div>

    <!-- القائمة العلوية -->
    <nav>
        <div class="nav-brand">
            <i class="fas fa-bars menu-icon" onclick="toggleSidebar()"></i>
            <div id="nav-logo-container"></div> <!-- اللوغو يظهر هنا -->
            <span class="site-title">DZ Nutritionniste</span>
        </div>
        <div class="nav-actions">
            <button id="auth-btn-nav" class="btn-nav-auth" onclick="handleAuthBtn()">Login</button>
            <div class="lang-switch" onclick="switchLang()">AR | FR</div>
            <div id="notif-btn" class="hidden notif-wrapper" onclick="showNotifs()">
                <i class="fas fa-bell"></i>
                <span id="notif-count">0</span>
            </div>
        </div>
    </nav>

    <!-- القائمة الجانبية -->
    <div class="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 data-t="menu">القائمة</h3>
            <i class="fas fa-times close-icon" onclick="toggleSidebar()"></i>
        </div>
        
        <div id="menu-links">
            <!-- روابط ديناميكية (حسب نوع الحساب) -->
        </div>

        <div class="sidebar-footer">
            <div class="menu-item" onclick="openStatic('about')"><i class="fas fa-info-circle"></i> <span data-t="about">من نحن</span></div>
            <div class="menu-item" onclick="openStatic('privacy')"><i class="fas fa-shield-alt"></i> <span data-t="privacy">السياسة</span></div>
            <div class="menu-item" onclick="openLoc()"><i class="fas fa-map-marker-alt"></i> <span data-t="location">مقرنا</span></div>
            <div class="menu-item" onclick="openReportModal()"><i class="fas fa-bug"></i> <span data-t="report">ابلاغ</span></div>
            <div id="btn-logout" class="menu-item hidden logout-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span data-t="logout">خروج</span></div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main>
        <!-- الصفحة الرئيسية -->
        <section id="landing">
            <div class="hero-bg"></div>
            <div class="hero-overlay"></div>
            <div class="hero-content animate__animated animate__fadeInUp">
                <h1 data-t="hero_title">غير حياتك للأفضل</h1>
                <button class="btn-glow" onclick="nav('register')" data-t="start_now">إبدأ الآن</button>
            </div>
        </section>

        <!-- تسجيل الدخول -->
        <section id="login" class="hidden">
            <div class="form-box animate__animated animate__zoomIn">
                <h2 data-t="login">تسجيل الدخول</h2>
                <input id="l-email" class="inp" type="email" placeholder="Email">
                <input id="l-pass" class="inp" type="password" placeholder="Password">
                <button class="btn-modern" onclick="doLogin()" data-t="login_btn">دخول</button>
                <p class="link-text" onclick="nav('register')" data-t="no_account">حساب جديد</p>
            </div>
        </section>

        <!-- إنشاء حساب -->
        <section id="register" class="hidden">
            <div class="form-box animate__animated animate__fadeIn">
                <h2 data-t="register">انشاء حساب</h2>
                
                <div class="role-switch">
                    <button id="role-user" class="role-btn active" onclick="setRole('user')" data-t="role_user">مستخدم</button>
                    <button id="role-pro" class="role-btn" onclick="setRole('pro')" data-t="role_pro">مختص</button>
                </div>

                <div class="input-grid">
                    <input id="r-name" class="inp" data-p="name">
                    <input id="r-phone" class="inp" type="tel" data-p="phone">
                </div>
                <input id="r-email" class="inp" type="email" data-p="email">
                
                <div class="input-grid">
                    <select id="r-gender" class="inp"><option value="Male" data-t="male">ذكر</option><option value="Female" data-t="female">أنثى</option></select>
                    <input id="r-age" class="inp" type="number" data-p="age">
                </div>
                
                <input id="r-pass" class="inp" type="password" data-p="password">
                <input id="r-pass2" class="inp" type="password" data-p="confirm_pass">

                <!-- حقول المختص الإضافية -->
                <div id="pro-fields" class="hidden pro-fields-box">
                    <h4 style="margin-bottom:10px; color:var(--primary)">معلومات المختص</h4>
                    <label data-t="wilaya">الولاية</label>
                    <input id="r-wilaya" class="inp">
                    
                    <label data-t="marital">الحالة الاجتماعية</label>
                    <select id="r-social" class="inp" onchange="toggleKids(this.value)">
                        <option value="Single" data-t="single">أعزب</option>
                        <option value="Married" data-t="married">متزوج</option>
                        <option value="Divorced" data-t="divorced">مطلق</option>
                    </select>
                    
                    <div id="kids-div" class="hidden">
                        <label data-t="kids">أولاد</label>
                        <select id="r-kids" class="inp">
                            <option value="No" data-t="no">لا</option>
                            <option value="Yes" data-t="yes">نعم</option>
                        </select>
                    </div>
                    
                    <label data-t="cert">الشهادة (صورة)</label>
                    <input id="r-cert" class="inp" type="file" accept="image/*">
                </div>

                <button class="btn-modern" onclick="doRegister()" data-t="register_btn">تسجيل</button>
            </div>
        </section>

        <!-- حاوية لوحات التحكم (سيتم ملؤها بالكود) -->
        <section id="dash-container" class="hidden dash-wrapper"></section>

        <!-- قوالب HTML (Templates) -->
        <!-- قالب الأدمن -->
        <template id="tpl-admin">
            <h2 class="section-title" data-t="admin_panel">Admin Panel</h2>
            <div class="admin-grid">
                <div class="adm-card g1" onclick="showAdm('users')"><h3 id="adm-u">0</h3><span data-t="users">Users</span></div>
                <div class="adm-card g2" onclick="showAdm('approvals')"><h3 id="adm-w">0</h3><span data-t="pending">Pending</span></div>
                <div class="adm-card g3" onclick="showAdm('reps')"><h3 id="adm-r">0</h3><span data-t="report">Reports</span></div>
                <div class="adm-card g4" onclick="showAdm('users')"><h3 id="adm-p">0</h3><span data-t="pros">Pros</span></div>
                <div class="adm-card g5" onclick="showAdm('sess')"><h3 id="adm-c">0</h3><span data-t="accepted_clients">Clients</span></div>
                <div class="adm-card g6" onclick="showAdm('sess')"><h3 id="adm-s">0</h3><span data-t="sessions">Sessions</span></div>
                <div class="adm-card g7"><h3 id="adm-vd">0</h3><span data-t="visits_day">Visits Day</span></div>
                <div class="adm-card g8"><h3 id="adm-vm">0</h3><span data-t="visits_month">Visits Month</span></div>
                <div class="adm-card g9" onclick="showAdm('cms')"><i class="fas fa-cogs fa-2x"></i><span data-t="settings">Settings</span></div>
            </div>
            <!-- الأقسام المخفية للادمن -->
            <div id="adm-view-users" class="hidden"><h3 data-t="users">Users</h3><input class="inp" onkeyup="filterUsers(this.value)" placeholder="Search"><div class="tbl-box"><table id="tbl-users"><thead><tr><th>Name</th><th>Role</th><th>Code</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-approvals" class="hidden"><h3 data-t="approvals">Approvals</h3><div class="tbl-box"><table id="tbl-apps"><thead><tr><th>Name</th><th>Cert</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-reps" class="hidden"><h3 data-t="report">Reports</h3><div class="tbl-box"><table id="tbl-reps"><thead><tr><th>Name</th><th>Email</th><th>Desc</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-sess" class="hidden"><h3 data-t="sessions">Sessions</h3><div class="tbl-box"><table id="tbl-sess"><thead><tr><th>Client</th><th>Pro</th><th>Date</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-cms" class="hidden">
                <div class="form-box full-width">
                    <h3 data-t="settings">Settings</h3>
                    <div class="input-grid">
                        <div><label data-t="logo">Logo</label><input type="file" id="adm-logo" class="inp"><div class="flex-gap"><button class="btn-modern" onclick="updLogo()" data-t="save">Update</button><button class="btn-del" onclick="delLogo()">Delete</button></div></div>
                        <div><label data-t="bg">Background</label><input type="file" id="adm-bg" class="inp"><div class="flex-gap"><button class="btn-modern" onclick="updBg()" data-t="save">Update</button><button class="btn-del" onclick="delBg()">Delete</button></div></div>
                    </div>
                    <hr>
                    <label data-t="add_banner">Banner</label><input type="file" id="ban-img" class="inp"><input id="ban-link" class="inp" placeholder="Link"><select id="ban-role" class="inp"><option value="all">All</option><option value="user">User</option><option value="pro">Pro</option></select><button class="btn-modern" onclick="addBan()" data-t="save">Add</button><div id="ban-list"></div>
                    <hr>
                    <label data-t="points_manager">Points</label><div class="flex-gap"><input id="pt-code" placeholder="Code" class="inp"><input id="pt-val" type="number" class="inp"><button class="btn-modern" onclick="setPts()" data-t="save">Set</button></div>
                    <hr>
                    <label data-t="send_notif">Notify</label><input id="nt-ar" class="inp" placeholder="Arabic"><input id="nt-fr" class="inp" placeholder="French"><select id="nt-tar" class="inp"><option value="all">All</option><option value="user">User</option><option value="pro">Pro</option></select><button class="btn-modern" onclick="sndNot()" data-t="send">Send</button>
                </div>
            </div>
        </template>

    </main>

    <!-- الفوتر -->
    <footer>
        <h4>DZ Nutritionniste</h4>
        <div class="footer-links">
            <span onclick="openStatic('about')" data-t="about">من نحن</span>
            <span onclick="openStatic('privacy')" data-t="privacy">السياسة</span>
            <span onclick="openLoc()" data-t="location">مقرنا</span>
            <span onclick="openReportModal()" data-t="report">ابلاغ</span>
        </div>
        <p>© 2026 All Rights Reserved.</p>
    </footer>

    <!-- النوافذ المنبثقة (Modals) -->
    <!-- بروفايل -->
    <div id="mod-profile" class="modal"><div class="modal-box"><h3 data-t="edit_profile">تعديل الملف</h3><label data-t="name">الاسم</label><input id="ped-name" class="inp"><label data-t="password">كلمة المرور</label><input id="ped-pass" class="inp"><label data-t="photo">الصورة</label><input type="file" id="ped-img" class="inp" accept="image/*"><button class="btn-modern" onclick="saveProf()" data-t="save">حفظ</button><button class="btn-del full-width" onclick="closeMod('mod-profile')" data-t="cancel">الغاء</button></div></div>
    <!-- تقييم -->
    <div id="mod-rate" class="modal"><div class="modal-box center-text"><h3 data-t="rate_pro">تقييم</h3><div class="stars" id="star-box"><i class="fas fa-star" onclick="rate(1)"></i><i class="fas fa-star" onclick="rate(2)"></i><i class="fas fa-star" onclick="rate(3)"></i><i class="fas fa-star" onclick="rate(4)"></i><i class="fas fa-star" onclick="rate(5)"></i></div><input type="hidden" id="rate-v"><textarea id="rate-c" class="inp" placeholder="Comment..."></textarea><button class="btn-modern" onclick="subRate()" data-t="send">ارسال</button><button class="btn-del full-width" onclick="closeMod('mod-rate')">X</button></div></div>
    <!-- ابلاغ -->
    <div id="mod-report" class="modal"><div class="modal-box"><h3 data-t="report">ابلاغ</h3><input id="rp-name" class="inp" data-p="name"><input id="rp-mail" class="inp" data-p="email"><textarea id="rp-desc" class="inp" data-p="desc"></textarea><button class="btn-modern" onclick="subRep()" data-t="send">ارسال</button><button class="btn-del full-width" onclick="closeMod('mod-report')">X</button></div></div>
    <!-- معلومات -->
    <div id="mod-info" class="modal"><div class="modal-box"><h3 id="inf-t" class="text-primary"></h3><div id="inf-c" class="info-content"></div><button class="btn-modern btn-grey" onclick="closeMod('mod-info')">Close</button></div></div>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
