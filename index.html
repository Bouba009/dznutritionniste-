<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DZ Nutritionniste</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- Firebase Libraries (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- SweetAlert2 (Popups) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2E7D32; /* Green */
            --primary-dark: #1B5E20;
            --accent: #FFC107; /* Amber */
            --text: #2c3e50;
            --light: #f8f9fa;
            --white: #ffffff;
            --radius: 12px;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --bg-def: url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=2053');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light); color: var(--text); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }

        /* --- LOADER --- */
        #loader { position: fixed; inset: 0; background: var(--white); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .spinner { width: 50px; height: 50px; border: 4px solid #eee; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- UTILS --- */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .center { align-items: center; justify-content: center; }
        .w-full { width: 100%; }
        .text-primary { color: var(--primary); }

        /* --- NAVBAR --- */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 5px 5%; height: 70px; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--primary); font-size: 1.1rem; }
        #nav-logo img { height: 45px; object-fit: contain; }
        .btn-auth-nav { background: var(--primary); color: white; padding: 6px 20px; border-radius: 20px; font-size: 0.9rem; border: none; cursor: pointer; font-weight: bold; transition:0.3s; }
        .btn-auth-nav:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .lang-switch { border: 2px solid var(--primary); padding: 3px 10px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }

        /* --- SIDEBAR --- */
        .sidebar {
            position: fixed; top: 0; right: -280px; width: 260px; height: 100vh;
            background: var(--white); z-index: 1100; padding: 20px;
            box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: 0.3s ease; display: flex; flex-direction: column;
        }
        .sidebar.active { right: 0; }
        [dir="ltr"] .sidebar { right: auto; left: -280px; }
        [dir="ltr"] .sidebar.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1050; display: none; }
        .overlay.active { display: block; }
        .menu-item { padding: 12px; margin: 5px 0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #555; font-weight: 600; transition: 0.2s; }
        .menu-item:hover { background: #e8f5e9; color: var(--primary); transform: translateX(-5px); }
        [dir="ltr"] .menu-item:hover { transform: translateX(5px); }

        /* --- HERO --- */
        main { margin-top: 70px; flex: 1; padding-bottom: 40px; }
        #landing { height: calc(100vh - 70px); position: relative; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
        .hero-bg { position: absolute; inset: 0; background-image: var(--bg-def); background-size: cover; background-position: center; z-index: -2; animation: zoomBg 20s infinite alternate; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)); z-index: -1; }
        .hero-content { position: relative; z-index: 1; padding: 20px; width: 100%; max-width: 700px; }
        @keyframes zoomBg { from {transform: scale(1);} to {transform: scale(1.1);} }

        .btn-glow {
            background: var(--accent); color: #000; padding: 15px 45px; border-radius: 50px; 
            font-weight: 800; border: none; font-size: 1.2rem; cursor: pointer; 
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.6); animation: pulse 2s infinite; text-transform: uppercase;
        }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.7);} 70% {box-shadow: 0 0 0 15px rgba(255, 193, 7, 0);} 100% {box-shadow: 0 0 0 0 rgba(255, 193, 7, 0);} }

        /* --- DASHBOARDS --- */
        .dash-container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }

        /* Admin 3x3 Grid */
        .admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .adm-card {
            padding: 15px; border-radius: 15px; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            box-shadow: var(--shadow); height: 130px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
        }
        .adm-card:hover { transform: translateY(-5px); }
        .adm-card h3 { font-size: 2.5rem; margin: 0; font-weight: 900; }
        .adm-card span { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-top: 5px; }
        
        /* Gradients */
        .g1 { background: linear-gradient(45deg, #FF512F, #DD2476); }
        .g2 { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .g3 { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .g4 { background: linear-gradient(45deg, #8E2DE2, #4A00E0); }
        .g5 { background: linear-gradient(45deg, #f12711, #f5af19); }
        .g6 { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .g7 { background: linear-gradient(45deg, #8360c3, #2ebf91); }
        .g8 { background: linear-gradient(45deg, #DA4453, #89216B); }
        .g9 { background: linear-gradient(45deg, #fc4a1a, #f7b733); }

        /* Pro 2x2 Grid */
        .pro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .pro-stat {
            padding: 25px; border-radius: 15px; color: white; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between;
            height: 150px; position: relative; overflow: hidden; transition: 0.3s;
        }
        .pro-stat:hover { transform: scale(1.02); }
        .pro-stat h3 { font-size: 3rem; margin: 0; font-weight: 800; }
        .pc1 { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); }
        .pc2 { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        .pc3 { background: linear-gradient(135deg, #f83600 0%, #f9d423 100%); }
        .pc4 { background: linear-gradient(135deg, #0ba360 0%, #3cba92 100%); }

        /* --- UI ELEMENTS --- */
        .tbl-box { overflow-x: auto; background: white; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
        th { background: #fafafa; color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
        [dir="rtl"] th, [dir="rtl"] td { text-align: right; }

        .pro-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .pro-item { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: var(--shadow); border-top: 5px solid var(--primary); transition:0.3s; }
        .pro-item:hover { transform: translateY(-5px); }
        .pro-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #eee; }

        .form-box { max-width: 550px; margin: 40px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: var(--shadow); }
        .inp { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; outline: none; transition: 0.3s; }
        .inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1); }
        
        .role-switch { display: flex; background: #f0f0f0; padding: 5px; border-radius: 10px; margin-bottom: 20px; }
        .role-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: transparent; transition:0.3s; color: #777; }
        .role-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .stars { font-size: 2rem; color: #ddd; cursor: pointer; display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; }
        .stars i.active { color: gold; animation: rubberBand 1s; }

        /* Buttons */
        .btn-modern { background: linear-gradient(45deg, #2E7D32, #43A047); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-modern:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-del { background: #ff4757; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; }
        .btn-del:hover { background: #e0404e; }
        .btn-adm-tab { background: white; border: 1px solid #eee; padding: 8px 15px; border-radius: 20px; color: #555; cursor: pointer; font-weight: bold; transition:0.3s; margin-bottom: 5px; white-space: nowrap; }
        .btn-adm-tab:hover { border-color: var(--primary); color: var(--primary); }

        /* Footer */
        footer { background: #1a1a1a; color: #fff; padding: 40px 20px; text-align: center; margin-top: auto; }
        .f-link { margin: 0 10px; cursor: pointer; color: #bbb; display: inline-block; transition: 0.3s; font-size: 0.9rem; }
        .f-link:hover { color: var(--accent); }

        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-box { background: white; width: 95%; max-width: 500px; padding: 30px; border-radius: 20px; max-height: 90vh; overflow-y: auto; animation: fadeInUp 0.3s; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }

        @media (max-width: 768px) {
            .admin-grid { grid-template-columns: 1fr 1fr; }
            .pro-grid { grid-template-columns: 1fr; }
            .hero-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader"><div class="spinner"></div><h4 style="margin-top:15px; color:var(--primary); font-weight:bold">DZ Nutritionniste</h4></div>

    <!-- Navbar -->
    <nav>
        <div class="nav-brand">
            <i class="fas fa-bars fa-lg" onclick="toggleSidebar()" style="cursor:pointer; color:var(--text)"></i>
            <div id="nav-logo"></div>
            <span>DZ Nutritionniste</span>
        </div>
        <div class="flex center" style="gap:10px">
            <button id="auth-btn-nav" class="btn-auth-nav" onclick="handleAuthBtn()">Login</button>
            <div onclick="switchLang()" class="lang-switch">AR | FR</div>
            <div id="notif-btn" class="hidden" style="position:relative; cursor:pointer" onclick="showNotifs()">
                <i class="fas fa-bell fa-lg" style="color:var(--primary)"></i>
                <span id="notif-badge" style="position:absolute; top:-5px; right:-5px; background:red; color:white; font-size:0.6rem; padding:2px 5px; border-radius:10px; display:none">0</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="flex" style="justify-content:space-between; margin-bottom:30px; border-bottom:1px solid #eee; padding-bottom:15px">
            <h3 data-t="menu" style="color:var(--primary)">القائمة</h3>
            <i class="fas fa-times" onclick="toggleSidebar()" style="cursor:pointer; font-size:1.5rem"></i>
        </div>
        <div id="menu-public">
            <div class="menu-item" onclick="nav('landing')"><i class="fas fa-home"></i> <span data-t="home">الرئيسية</span></div>
            <div class="menu-item" onclick="nav('login')"><i class="fas fa-sign-in-alt"></i> <span data-t="login">دخول</span></div>
        </div>
        <div id="menu-private" class="hidden">
            <div class="menu-item" onclick="navDash()"><i class="fas fa-th-large"></i> <span data-t="dashboard">لوحة التحكم</span></div>
            <div class="menu-item" onclick="openProfile()"><i class="fas fa-user-circle"></i> <span data-t="profile">الملف الشخصي</span></div>
        </div>
        <div style="margin-top:auto">
            <div class="menu-item" onclick="openStatic('about')"><i class="fas fa-info-circle"></i> <span data-t="about">من نحن</span></div>
            <div class="menu-item" onclick="openStatic('privacy')"><i class="fas fa-shield-alt"></i> <span data-t="privacy">السياسة</span></div>
            <div class="menu-item" onclick="openLoc()"><i class="fas fa-map-marker-alt"></i> <span data-t="location">مقرنا</span></div>
            <div class="menu-item" onclick="openReportModal()"><i class="fas fa-bug"></i> <span data-t="report">ابلاغ</span></div>
            <div id="btn-logout" class="menu-item hidden" style="color:red; margin-top:10px; border-top:1px solid #eee" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span data-t="logout">خروج</span></div>
        </div>
    </div>

    <!-- Main -->
    <main>
        <!-- Landing -->
        <section id="landing">
            <div class="hero-bg"></div><div class="hero-overlay"></div>
            <div class="hero-content animate__animated animate__fadeInUp">
                <h1 style="font-size:3rem; margin-bottom:20px; font-weight:900" data-t="hero_title">غير حياتك للأفضل</h1>
                <button class="btn-glow" onclick="nav('register')" data-t="start_now">إبدأ الآن</button>
            </div>
        </section>

        <!-- Login -->
        <section id="login" class="hidden">
            <div class="form-box animate__animated animate__zoomIn">
                <h2 class="text-center mb-4" data-t="login" style="color:var(--primary)">تسجيل الدخول</h2>
                <input id="l-email" class="inp" placeholder="Email" type="email">
                <input id="l-pass" type="password" class="inp" placeholder="Password">
                <button class="btn-modern" onclick="doLogin()" data-t="login_btn">دخول</button>
                <p class="text-center mt-3" style="cursor:pointer; color:var(--primary); font-weight:bold" onclick="nav('register')" data-t="no_account">حساب جديد</p>
            </div>
        </section>

        <!-- Register -->
        <section id="register" class="hidden">
            <div class="form-box animate__animated animate__fadeIn">
                <h2 class="text-center mb-4" data-t="register">انشاء حساب</h2>
                <div class="role-switch">
                    <button id="role-user" class="role-btn active" onclick="setRole('user')" data-t="role_user">مستخدم</button>
                    <button id="role-pro" class="role-btn" onclick="setRole('pro')" data-t="role_pro">مختص</button>
                </div>
                <input id="r-name" class="inp" data-p="name">
                <input id="r-phone" type="tel" class="inp" data-p="phone">
                <input id="r-email" type="email" class="inp" data-p="email">
                <div class="flex" style="gap:10px">
                    <select id="r-gender" class="inp"><option value="Male" data-t="male">ذكر</option><option value="Female" data-t="female">أنثى</option></select>
                    <input id="r-age" type="number" class="inp" data-p="age">
                </div>
                <input id="r-pass" type="password" class="inp" data-p="password">
                <input id="r-pass2" type="password" class="inp" data-p="confirm_pass">
                
                <!-- Fields for Pro -->
                <div id="pro-fields" class="hidden animate__animated animate__fadeIn" style="background:#f9f9f9; padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid #eee">
                    <label data-t="wilaya" style="font-weight:bold; font-size:0.9rem">الولاية</label><input id="r-wilaya" class="inp">
                    <label data-t="marital" style="font-weight:bold; font-size:0.9rem">الحالة الاجتماعية</label>
                    <select id="r-social" class="inp" onchange="toggleKids(this.value)">
                        <option value="Single" data-t="single">أعزب</option><option value="Married" data-t="married">متزوج</option><option value="Divorced" data-t="divorced">مطلق</option>
                    </select>
                    <div id="kids-div" class="hidden"><label data-t="kids" style="font-weight:bold; font-size:0.9rem">أولاد</label><select id="r-kids" class="inp"><option value="No" data-t="no">لا</option><option value="Yes" data-t="yes">نعم</option></select></div>
                    <label data-t="cert" style="font-weight:bold; font-size:0.9rem">الشهادة</label><input id="r-cert" type="file" class="inp" accept="image/*">
                </div>
                <button class="btn-modern" onclick="doRegister()" data-t="register_btn">تسجيل</button>
            </div>
        </section>

        <!-- Dynamic Dashboard Container -->
        <section id="dash-container" class="hidden" style="max-width:1100px; margin:20px auto; padding:0 15px"></section>

        <!-- Admin Template -->
        <template id="tpl-admin">
            <h2 class="mb-4" data-t="admin_panel" style="color:var(--primary); font-weight:900">Admin Panel</h2>
            <div class="admin-grid">
                <div class="adm-card g1" onclick="showAdm('users')"><h3 id="adm-u">0</h3><span data-t="users">Users</span></div>
                <div class="adm-card g2" onclick="showAdm('apps')"><h3 id="adm-w">0</h3><span data-t="pending">Pending</span></div>
                <div class="adm-card g3" onclick="showAdm('reps')"><h3 id="adm-r">0</h3><span data-t="report">Reports</span></div>
                <div class="adm-card g4" onclick="showAdm('users')"><h3 id="adm-p">0</h3><span data-t="pros">Pros</span></div>
                <div class="adm-card g5" onclick="showAdm('sess')"><h3 id="adm-c">0</h3><span data-t="accepted_clients">Clients</span></div>
                <div class="adm-card g6" onclick="showAdm('sess')"><h3 id="adm-s">0</h3><span data-t="sessions">Sessions</span></div>
                <div class="adm-card g7"><h3 id="adm-vd">0</h3><span data-t="visits_day">Visits Day</span></div>
                <div class="adm-card g8"><h3 id="adm-vm">0</h3><span data-t="visits_month">Visits Month</span></div>
                <div class="adm-card g9" onclick="showAdm('cms')"><i class="fas fa-cogs fa-2x"></i><span data-t="settings">Settings</span></div>
            </div>
            
            <div class="flex" style="gap:5px; overflow-x:auto; margin-bottom:20px; padding-bottom:5px">
                <button class="btn-adm-tab" onclick="showAdm('users')" data-t="users">Users</button>
                <button class="btn-adm-tab" onclick="showAdm('apps')" data-t="approvals">Approvals</button>
                <button class="btn-adm-tab" onclick="showAdm('reps')" data-t="report">Reports</button>
                <button class="btn-adm-tab" onclick="showAdm('cms')" data-t="settings">Settings</button>
            </div>

            <div id="adm-view-users" class="hidden"><h3 data-t="users">Users</h3><input class="inp" onkeyup="filterUsers(this.value)" placeholder="Search..."><div class="tbl-box"><table id="tbl-users"><thead><tr><th>Name</th><th>Role</th><th>Code</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-apps" class="hidden"><h3 data-t="approvals">Approvals</h3><div class="tbl-box"><table id="tbl-apps"><thead><tr><th>Name</th><th>Cert</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-reps" class="hidden"><h3 data-t="report">Reports</h3><div class="tbl-box"><table id="tbl-reps"><thead><tr><th>Name</th><th>Email</th><th>Desc</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-sess" class="hidden"><h3 data-t="sessions">Sessions</h3><div class="tbl-box"><table id="tbl-sess"><thead><tr><th>Client</th><th>Pro</th><th>Date</th></tr></thead><tbody></tbody></table></div></div>
            <div id="adm-view-cms" class="hidden">
                <div class="form-box" style="max-width:100%; margin:0">
                    <h3 data-t="settings">Settings</h3>
                    <div class="flex" style="gap:20px; flex-wrap:wrap">
                        <div style="flex:1"><label data-t="logo">Logo</label><input type="file" id="adm-logo" class="inp"><div class="flex" style="gap:5px"><button class="btn-modern" onclick="updLogo()">Update</button><button class="btn-del" onclick="delLogo()">Delete</button></div></div>
                        <div style="flex:1"><label data-t="bg">Background</label><input type="file" id="adm-bg" class="inp"><div class="flex" style="gap:5px"><button class="btn-modern" onclick="updBg()">Update</button><button class="btn-del" onclick="delBg()">Delete</button></div></div>
                    </div>
                    <hr class="my-3"><label data-t="add_banner">Banner</label><input type="file" id="ban-img" class="inp"><input id="ban-link" class="inp" placeholder="Link"><select id="ban-role" class="inp"><option value="all">All</option><option value="user">User</option><option value="pro">Pro</option></select><button class="btn-modern" onclick="addBan()">Add</button><div id="ban-list" style="margin-top:10px"></div>
                    <hr class="my-3"><label data-t="points_manager">Points</label><div class="flex" style="gap:10px"><input id="pt-code" placeholder="Code" class="inp"><input id="pt-val" type="number" class="inp"><button class="btn-modern" onclick="setPts()">Set</button></div>

        function t(k){return tD[lang][k]||k;}

            let c={icon:icon,title:t(kTitle),text:t(kText),timer:3000,showConfirmButton:false};
            if(kTitle==='reg_ok_pro'){c.iconHtml='<i class="fas fa-clock fa-2x" style="color:#2196F3"></i>';c.timer=5000;}
            Swal.fire(c);
        }
        function loadCMS(){
            db.collection('settings').doc('config').onSnapshot(s=>{
                if(s.exists){ const d=s.data(); if(d.logo)document.getElementById('nav-logo').innerHTML=`<img src="${d.logo}">`; if(d.bg)document.querySelector('.hero-bg').style.backgroundImage=`url('${d.bg}')`; }
            });
        }

        function nav(id){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));if(document.getElementById(id))document.getElementById(id).classList.remove('hidden');if(id==='dash-container')document.getElementById('dash-container').classList.remove('hidden');toggleSidebar(false);}

        function handleAuthBtn(){if(currentUser)logout();else nav('login');}

            if(!n||!e||!p)return sAlert('error','err_title','login_err');
            if(p!==p2)return sAlert('error','err_title','pass_mismatch');
            let d={name:n,email:e,pass:p,role:regRole,status:regRole==='user'?'active':'pending',joined:Date.now(),
                phone:document.getElementById('r-phone').value, gender:document.getElementById('r-gender').value, age:document.getElementById('r-age').value};
            if(regRole==='pro'){d.wilaya=document.getElementById('r-wilaya').value;d.marital=document.getElementById('r-social').value;if(d.marital!=='Single')d.kids=document.getElementById('r-kids').value;const f=document.getElementById('r-cert').files[0];if(f)d.cert=await toBase64(f); d.code='T'+Math.floor(10000+Math.random()*90000); d.lastAccepted=0; d.points=0;}
            try{await db.collection('users').add(d);sAlert(regRole==='user'?'success':'info','succ_title',regRole==='user'?'reg_ok_user':'reg_ok_pro');nav('login');}catch(x){Swal.fire('Error',x.message,'error');}
        }
        async function doLogin(){
            const e=document.getElementById('l-email').value,p=document.getElementById('l-pass').value;
            if(e==='admin'&&p==='abobob123'){currentUser={role:'admin',name:'Admin'};initApp();return;}
            const q=await db.collection('users').where('email','==',e).where('pass','==',p).get();
            if(q.empty)return sAlert('error','err_title','login_err');
            const u={id:q.docs[0].id,...q.docs[0].data()};
            if(u.status==='banned')return sAlert('error','err_title','ban_msg');
            if(u.status==='pending')return sAlert('warning','err_title','pend_msg');
            if(u.status==='rejected')return sAlert('error','err_title','rej_msg');
            currentUser=u; localStorage.setItem('uid',u.id); initApp();
        }
        function logout(){currentUser=null;localStorage.removeItem('uid');location.reload();}

        // --- 6. LOGIC ---
        function initApp(){
            document.getElementById('loader').classList.add('hidden');document.getElementById('menu-public').classList.add('hidden');document.getElementById('menu-private').classList.remove('hidden');document.getElementById('btn-logout').classList.remove('hidden');document.getElementById('notif-btn').classList.remove('hidden');updateAuthBtn();
            if(currentUser.role==='admin')renderAdmin();else if(currentUser.role==='pro')initPro();else initUser();
            checkNotifs();
        }
        function navDash(){if(currentUser.role==='admin')renderAdmin();else if(currentUser.role==='pro')initPro();else initUser();}

        // User Dash
        function initUser(){
            nav('dash-container'); const c=document.getElementById('dash-container'); c.innerHTML=`<div id="u-slider" style="height:220px;border-radius:15px;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow)"></div><div class="flex" style="background:white;padding:20px;border-radius:15px;align-items:center;gap:20px;margin-bottom:20px"><img src="${currentUser.img||'https://via.placeholder.com/80'}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary)"><div><h2 style="margin:0">${currentUser.name}</h2><span>${t('welcome')}</span></div></div><h3 class="mb-2" style="color:var(--text);font-weight:bold">${t('available_pros')}</h3><div id="pros-list" class="pro-list mb-4"></div><div class="tbl-box"><table><thead><tr><th>${t('pro')}</th><th>${t('status')}</th><th>${t('action')}</th></tr></thead><tbody id="u-hist"></tbody></table></div>`;
            loadBans('u-slider','user'); applyLang();
            db.collection('users').where('role','==','pro').where('status','==','active').onSnapshot(s=>{
                const l=document.getElementById('pros-list'); l.innerHTML="";
                let arr=[]; s.forEach(d=>arr.push({id:d.id,...d.data()}));
                arr=arr.filter(p=>(Date.now()-(p.lastAccepted||0))>3600000); 
                arr.forEach(p=>{ const rt=p.rc?(p.rs/p.rc).toFixed(1):0; l.innerHTML+=`<div class="pro-item"><img src="${p.img||'https://via.placeholder.com/80'}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary)"><h4>${p.name}</h4><div style="color:gold" onclick="viewRev('${p.id}')">⭐ ${Math.round(rt)} (${p.rc||0})</div><small>${p.wilaya||''}</small><button class="btn-modern" style="margin-top:10px" onclick="req('${p.id}','${p.name}')">${t('request')}</button></div>`; });
            });
            db.collection('apps').where('uid','==',currentUser.id).onSnapshot(s=>{
                const b=document.getElementById('u-hist'); b.innerHTML="";
                let hArr=[]; s.forEach(d=>hArr.push({id:d.id,...d.data()})); hArr.sort((a,b)=>b.date-a.date);
                hArr.forEach(x=>{ let act=`<span>${t('wait')}</span>`; if(x.status==='accepted'){act=x.rated?'✅':`<button class="btn-modern" style="padding:5px 10px;width:auto" onclick="openRate('${x.pid}','${x.id}')">⭐</button>`;}else if(x.status==='rejected')act='❌'; b.innerHTML+=`<tr><td>${x.pName}</td><td>${t(x.status)}</td><td>${act}</td></tr>`;});
            });
        }
        async function req(pid,pnm){await db.collection('apps').add({uid:currentUser.id, uName:currentUser.name, uAge:currentUser.age, uGen:currentUser.gender, pid:pid, pName:pnm, status:'pending', date:Date.now()}); sAlert('success','req_ok_title','req_ok_msg');}

        // Pro Dash

            loadBans('p-slider','pro'); applyLang();
            db.collection('apps').where('pid','==',currentUser.id).onSnapshot(s=>{
                const r=document.getElementById('p-req'), cl=document.getElementById('p-cli'); r.innerHTML=""; cl.innerHTML=""; let st={n:0,t:0,r:0,c:0}, cSet=new Set();
                let arr=[]; s.forEach(d=>arr.push({id:d.id,...d.data()})); arr.sort((a,b)=>b.date-a.date);
                arr.forEach(x=>{
                    st.t++;
                    if(x.status==='pending'){st.n++; r.innerHTML+=`<tr><td>${x.uName}</td><td>${x.uAge}</td><td>${t(x.uGen=='Female'?'female':'male')}</td><td><div class="flex" style="gap:5px"><button class="btn-modern" style="width:auto;padding:5px 10px;background:green" onclick="ans('${x.id}',1)">✔</button> <button class="btn-modern" style="width:auto;padding:5px 10px;background:red" onclick="ans('${x.id}',0)">✖</button></div></td></tr>`;}
                    else if(x.status==='rejected')st.r++;
                    else if(x.status==='accepted'){
                        if(!cSet.has(x.uid)){cSet.add(x.uid); db.collection('users').doc(x.uid).get().then(u=>{const ud=u.data(); cl.innerHTML+=`<tr><td>${ud.name}</td><td>${ud.phone}</td><td>${ud.email}</td></tr>`;});}
                    }
                });
                document.getElementById('stat-new').innerText=st.n; document.getElementById('stat-tot').innerText=st.t; document.getElementById('stat-rej').innerText=st.r; document.getElementById('stat-cli').innerText=cSet.size;
            });
        }
        async function ans(aid,ok){await db.collection('apps').doc(aid).update({status:ok?'accepted':'rejected'}); if(ok)await db.collection('users').doc(currentUser.id).update({lastAccepted:Date.now()});}

                    const u=doc.data(); uCache.push({id:doc.id,...u});

                });
            });
            db.collection('reports').onSnapshot(s=>{document.getElementById('adm-r').innerText=s.size; const tb=document.querySelector('#tbl-reps tbody'); tb.innerHTML=""; s.forEach(d=>{const r=d.data(); tb.innerHTML+=`<tr><td>${r.name}</td><td>${r.email}</td><td>${r.desc}</td><td><button class="btn-del" onclick="delRep('${d.id}')">Del</button></td></tr>`;});});
            db.collection('apps').where('status','==','accepted').onSnapshot(s=>{document.getElementById('adm-s').innerText=s.size; document.getElementById('adm-c').innerText=new Set(s.docs.map(d=>d.data().uid)).size; const tb=document.querySelector('#tbl-sess tbody'); tb.innerHTML=""; s.forEach(d=>{const x=d.data(); tb.innerHTML+=`<tr><td>${x.uName}</td><td>${x.pName}</td><td>${new Date(x.date).toLocaleDateString()}</td></tr>`;});});
            db.collection('stats').doc('visits').onSnapshot(d=>{if(d.exists){const dt=d.data(),k=new Date().toISOString().split('T')[0];document.getElementById('adm-vd').innerText=dt[k]||0;document.getElementById('adm-vm').innerText=dt[k.substring(0,7)]||0;}});
            db.collection('banners').onSnapshot(s=>{const bl=document.getElementById('ban-list'); bl.innerHTML=""; s.forEach(d=>{bl.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #eee"><img src="${d.data().img}" width="50"><button class="btn-del" onclick="delBan('${d.id}')">Del</button></div>`;});});
        }
        function showAdm(id){document.querySelectorAll('[id^="adm-view-"]').forEach(e=>e.classList.add('hidden'));document.getElementById('adm-view-'+id).classList.remove('hidden');}
        
        // Admin Actions
        async function updLogo(){const f=document.getElementById('adm-logo').files[0]; if(f){const b=await toBase64(f); db.collection('settings').doc('config').set({logo:b},{merge:true}); sAlert('success','succ_title','saved_msg');}}
        async function delLogo(){await db.collection('settings').doc('config').update({logo:firebase.firestore.FieldValue.delete()}); sAlert('success','succ_title','saved_msg');}
        async function updBg(){const f=document.getElementById('adm-bg').files[0]; if(f){const b=await toBase64(f); db.collection('settings').doc('config').set({bg:b},{merge:true}); sAlert('success','succ_title','saved_msg');}}
        async function delBg(){await db.collection('settings').doc('config').update({bg:firebase.firestore.FieldValue.delete()}); sAlert('success','succ_title','saved_msg');}
        async function addBan(){const f=document.getElementById('ban-img').files[0],l=document.getElementById('ban-link').value,r=document.getElementById('ban-role').value; if(f){const b=await toBase64(f); await db.collection('banners').add({img:b,link:l,target:r}); sAlert('success','succ_title','saved_msg');}}
        async function delBan(id){await db.collection('banners').doc(id).delete();}
        async function setPts(){const c=document.getElementById('pt-code').value,v=parseInt(document.getElementById('pt-val').value); const s=await db.collection('users').where('code','==',c).get(); if(!s.empty){await db.collection('users').doc(s.docs[0].id).update({points:v}); sAlert('success','succ_title','saved_msg');}else Swal.fire('Error','Code not found','error');}
        async function delUser(id){if(confirm('Delete?'))await db.collection('users').doc(id).delete();}
        async function approve(id,ok){await db.collection('users').doc(id).update({status:ok?'active':'rejected'});}
        async function delRep(id){await db.collection('reports').doc(id).delete();}
        async function sndNot(){const a=document.getElementById('nt-ar').value,f=document.getElementById('nt-fr').value,t=document.getElementById('nt-tar').value;await db.collection('notifs').add({ar:a,fr:f,target:t,date:Date.now()});sAlert('success','succ_title','sent_msg');}
        function viewCert(c){const w=window.open();w.document.write(`<img src="${c}" style="max-width:100%">`);}
        function filterUsers(v){const t=document.querySelector('#tbl-users tbody');const rows=t.getElementsByTagName('tr');for(let i=0;i<rows.length;i++){const n=rows[i].getElementsByTagName('td')[0];if(n){rows[i].style.display=n.innerHTML.toLowerCase().indexOf(v.toLowerCase())>-1?'':'none';}}}

        // Utils
        function checkNotifs(){const r=currentUser.role=='admin'?'admin':currentUser.role; db.collection('notifs').where('target','in',['all',r]).onSnapshot(s=>{let c=0;s.forEach(d=>{if(!localStorage.getItem('rn_'+d.id))c++});const b=document.getElementById('notif-badge');b.innerText=c;b.style.display=c>0?'block':'none';});}
        function showNotifs(){const r=currentUser.role=='admin'?'admin':currentUser.role; db.collection('notifs').where('target','in',['all',r]).get().then(s=>{let h="";s.forEach(d=>{localStorage.setItem('rn_'+d.id,'1');h+=`<div style="padding:10px;border-bottom:1px solid #eee">${lang=='ar'?d.data().ar:d.data().fr}</div>`});document.getElementById('inf-t').innerText=t('report');document.getElementById('inf-c').innerHTML=h||"Empty";document.getElementById('mod-info').style.display='flex';document.getElementById('notif-badge').style.display='none';});}
        async function loadBans(eid,r){db.collection('banners').where('target','in',['all',r]).onSnapshot(s=>{const e=document.getElementById(eid);e.innerHTML="";s.forEach((d,i)=>e.innerHTML+=`<img src="${d.data().img}" style="width:100%;height:100%;object-fit:cover;display:${i==0?'block':'none'}" onclick="window.open('${d.data().link||'#'}')">`);if(s.size>1){let x=0;setInterval(()=>{const m=e.querySelectorAll('img');m.forEach(z=>z.style.display='none');x=(x+1)%m.length;m[x].style.display='block';},4000);}});}
        function openProfile(){document.getElementById('ped-name').value=currentUser.name;document.getElementById('mod-profile').style.display='flex';}
        async function saveProf(){const n=document.getElementById('ped-name').value,p=document.getElementById('ped-pass').value,f=document.getElementById('ped-img').files[0];let u={name:n};if(p)u.pass=p;if(f)u.img=await toBase64(f);await db.collection('users').doc(currentUser.id).update(u);currentUser={...currentUser,...u};closeMod('mod-profile');sAlert('success','succ_title','saved_msg');location.reload();}
        function openReportModal(){document.getElementById('mod-report').style.display='flex';}
        async function subRep(){const n=document.getElementById('rp-name').value,e=document.getElementById('rp-mail').value,d=document.getElementById('rp-desc').value;if(!d)return;await db.collection('reports').add({name:n,email:e,desc:d});closeMod('mod-report');sAlert('success','succ_title','sent_msg');}
        function openStatic(k){document.getElementById('inf-t').innerText=t(k);document.getElementById('inf-c').innerText=t(k+'_text');document.getElementById('mod-info').style.display='flex';}
        function openLoc(){document.getElementById('inf-t').innerText=t('location');document.getElementById('inf-c').innerHTML=`<p>Rouiba city dl lycée</p><p>رويبة حي الثانوية</p><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3197.433!2d3.283!3d36.737!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzbCsDQ0JzE0LjAiTiAzwrAxNycwMC.0IkU!5e0!3m2!1sen!2sdz!4v1600000000000!5m2!1sen!2sdz" width="100%" height="250" style="border:0; margin-top:10px"></iframe><br><a href="https://maps.app.goo.gl/gkPqMuz4VGgTsrSs9" target="_blank" style="color:blue">Google Maps</a>`;document.getElementById('mod-info').style.display='flex';}
        function openRate(pid,aid){rateM={pid,aid};document.getElementById('mod-rate').style.display='flex';rate(0);}
        function rate(n){document.getElementById('rate-v').value=n;document.querySelectorAll('#star-box i').forEach((s,i)=>s.className=i<n?'fas fa-star active':'fas fa-star');}
        async function subRate(){const v=parseInt(document.getElementById('rate-v').value),c=document.getElementById('rate-c').value;if(!v)return;await db.collection('reviews').add({pid:rateM.pid,stars:v,comment:c,u:currentUser.name});const r=db.collection('users').doc(rateM.pid);await db.runTransaction(async t=>{const d=await t.get(r);const dd=d.data();t.update(r,{rc:(dd.rc||0)+1,rs:(dd.rs||0)+v})});await db.collection('apps').doc(rateM.aid).update({rated:true});closeMod('mod-rate');sAlert('success','succ_title','saved_msg');}
        function viewRev(pid){db.collection('reviews').where('pid','==',pid).get().then(s=>{let h="";s.forEach(d=>{const x=d.data();h+=`<div style="padding:10px;border-bottom:1px solid #eee;text-align:${lang=='ar'?'right':'left'}"><b>${x.u}</b> ${'⭐'.repeat(x.stars)}<br>${x.comment}</div>`});document.getElementById('inf-t').innerText=t('reviews');document.getElementById('inf-c').innerHTML=h||"No reviews";document.getElementById('mod-info').style.display='flex';});}
        function closeMod(i){document.getElementById(i).style.display='none';}
    </script>
</body>
</html>
